# Light half of the lazygit theme. See theme-dark.yml for how it is merged.
#
# The dark half's colours are hardcoded for a dark ground: #3d4966 as the
# selected row put dark text on a dark navy band, and #519f50 sat at 1.7:1 on a
# light one. These are the equivalents from the Claude light palette --
# selection matches tmux's copy-mode highlight, and the rest are the terminal
# palette's own inks, which are tuned against that warm background.
gui:
  theme:
    selectedLineBgColor:
      - "#d3a184"
    selectedRangeBgColor:
      - "#d3a184"
    cherryPickedCommitFgColor:
      - "#3d5f11"
    cherryPickedCommitBgColor:
      - "#ddd2c3"
    # lazygit's defaults here are tuned for a dark ground too: the active border
    # is green and the inactive one near-white, both faint on this ground.
    activeBorderColor:
      - "#c2552f"
      - bold
    inactiveBorderColor:
      - "#a09a8b"
    optionsTextColor:
      - "#1f4e79"

# Overrides config.yml's entry wholesale -- lists are replaced, not merged --
# purely to swap --dark for --light. Without it delta renders for a dark ground:
# washed-out backgrounds that vanish into the light ground.
git:
  diffRenderers:
    - colorArg: always
      command: delta --light --paging=never --side-by-side --width=$COLUMNS
