# True color: tmux-256color inside tmux, passthrough RGB to the outer terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'

# Reduce Escape key delay (default 500ms causes noticeable lag in vim)
set -sg escape-time 10

# Pass focus events through to vim/nvim (needed for autoread & FocusGained autocmds)
set -g focus-events on

# Let Ctrl-Alt-<digit> and friends reach the program inside. Without extended
# keys a terminal can only encode the combinations that have a control code, so
# Ctrl-Alt-1 arrives as a plain "1" or as nothing at all -- which is why the org
# git float had to use a Ctrl-g prefix before. "on" only sends the extended form
# for keys that need it, so ordinary typing is unchanged.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r
bind r source-file ~/.tmux.conf

# prefix + T: flip this config between light and dark, and tell WezTerm, tmux
# and every reachable Neovim. All three resolve the theme once at load, so none
# of them notices on its own. See scripts/toggle-theme.sh.
# -b, or the tmux client blocks until the whole toggle finishes and the key
# feels dead for a second or more.
bind T run-shell -b "~/.config/tmux/scripts/toggle-theme.sh"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen + scrollback (works in nested tmux with C-a C-a L)
bind L send-keys -R \; clear-history

# switch windows with prefix + Left/Right (repeatable)
# bind both Left and C-Left so it works whether or not Ctrl is held after prefix
bind -r Left previous-window
bind -r Right next-window
bind -r C-Left previous-window
bind -r C-Right next-window

# Option+1..8 jump straight to that window, Option+9 to the last one, no prefix.
# Option is Alt here (WezTerm sends the composed key as Alt), and tmux consumes
# these before the pane sees them, which is why nvim's bufferline no longer
# binds Alt+digit -- it cycles with Alt+h / Alt+l instead.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t '{end}'

# New window, no prompt -- it auto-labels with the current directory's basename
# (see automatic-rename-format below) and keeps tracking it.
bind c new-window -c '#{pane_current_path}'

# Same, but prompting for a name (pre-filled with the directory basename --
# Enter accepts it, C-u clears the field first).
# @manual_name marks a window whose label the user chose. nvim checks it before
# syncing the window name to the current buffer (see nvim/lua/vim-window.lua),
# so a hand-picked label is not overwritten when switching files or panes.
# Submitting an empty name clears the mark and restores automatic naming.
bind C command-prompt -I "#{b:pane_current_path}" -p "window name:" {
  if-shell -F "#{==:%%,}" {
    new-window -c "#{pane_current_path}"
  } {
    new-window -c "#{pane_current_path}" -n "%%" ; set -w @manual_name 1
  }
}
# rename the current window; empty input hands it back to automatic naming
bind , command-prompt -I "#W" -p "rename window:" {
  if-shell -F "#{==:%%,}" {
    set -uw @manual_name ; set -uw automatic-rename
  } {
    rename-window -- "%%" ; set -w @manual_name 1
  }
}

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# open a note for billion $ idea
bind -r e split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r o split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# One window per git repo under a root directory -- turns a checked-out org into
# tabs, each a shell already in that repo. The prompt is prefilled with kompas, the
# common case, and is editable for any other folder of sibling repos. Enter on an
# unchanged prompt is one keypress away; -I keeps the script generic instead of
# hardcoding the path.
bind G command-prompt -I "~/Personal/01. happy-learning/Kris/kompas" -p "repo root:" {
    run-shell "~/.config/tmux/scripts/tmux-org-tabs.sh '%%'"
}

# Appearance, from ~/.config/kris-theme -- this config's own state rather than
# macOS's. Read once per config load: prefix + r re-reads it, and prefix + T
# flips it and reloads everything that has to be told. Anything but "light" is
# dark, so a missing file is dark.
#
# The themes carry only what actually differs -- the pane chrome. Everything the
# status bar draws with is below, identical either way.
if-shell '[ "$(cat ~/.config/kris-theme 2>/dev/null)" = "light" ]' \
    'source-file ~/.config/tmux/themes/light.conf' \
    'source-file ~/.config/tmux/themes/dark.conf'

# The status bar is the same in both appearances: chrome, like WezTerm's tab
# bar, framing the work rather than being part of it. So the palette is set once
# here rather than twice in the themes.
#
# Before tpm: catppuccin's palette files only set a colour if it is still unset
# (`set -ogq`), so the flavour has to be chosen before they load.
set -g @catppuccin_flavor "mocha"

# The bar's ground -- see status-style at the end of this file.
set -g @kris_bar_bg "#151414"

# Session and active-window chips both carry WezTerm's dark active tab; the
# inactive window chip stays on catppuccin's own surfaces.
set -g @kris_session_bg "#590000"
set -g @kris_session_fg "#ffffff"
set -g @kris_num_bg     "#{@thm_overlay_2}"
set -g @kris_num_fg     "#{@thm_crust}"
set -g @kris_cur_num_bg "#590000"
set -g @kris_cur_num_fg "#ffffff"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# save tmux session even tmux-server is killed
# use uppercase bindings so restore/save are easier to hit than Ctrl combos
# leader + S for saving from tmux-resurrect
# leader + R for restore from tmux-resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'xamut/tmux-weather'

# Pane borders - highlight active pane
#
# The border line carries the pane's command, so on a window with a single pane
# it is a label for something there is only one of -- a row of screen spent
# saying "zsh". pane-border-status takes off/top/bottom and not a format, so it
# cannot be made conditional on its own; instead it defaults to off and a hook
# turns it on for any window that has more than one pane.
#
# One hook is enough: window-layout-changed fires when a split adds a pane and
# again when one goes away, whether it was killed or its shell simply exited.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set -g pane-border-lines double
set -g pane-border-indicators off
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@kris_pane_active_fg},bold"
set -g pane-border-format "#[align=centre]#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],} #{?pane_active,#[fg=#{@kris_pane_cmd_fg}]#[bg=#{@kris_pane_cmd_bg}]#[bold] #{pane_current_command} #[default],#[fg=#{@kris_pane_inactive_fg}]#{pane_current_command}#[default]}#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],}"

# status bar
# Configure the catppuccin plugin. The flavour itself is set in themes/*.conf,
# above, alongside the palette overrides it has to stay in step with.
set -g @catppuccin_window_status_style "rounded"

# Label tabs with the window name (#W) instead of catppuccin's default #T,
# which is the pane title and is always just the hostname here.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Windows that were never named explicitly fall back to the current directory's
# basename rather than "zsh". Naming one with prefix+C (or prefix+,) turns this
# automatic renaming off for that window, so the chosen label sticks.
set -g automatic-rename-format "#{b:pane_current_path}"

set -g window-status-separator ""  # Removes the space between windows

set -g status-left-length 120
#set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]#[noreverse]#S #[fg=#{@thm_green},bg=#{@thm_sapphire}]#[fg=#{@thm_crust},bg=#{@thm_sapphire}] #{s|$HOME|~|:pane_current_path} "
# Plain set, not -gF: -F expands the whole string once at set time, and that
# would consume the #S here, freezing whatever the session was called when the
# config loaded. The E: forms resolve at render time instead, which is what the
# window formats below get from -F only because they reach #I and #W through
# options rather than writing them literally.
set -g status-left "#[bg=#{E:@kris_session_bg},fg=#{E:@kris_session_fg}]#[reverse]#[noreverse] #S "

set -g status-interval 15
set -g status-right-length 120 #character length

# Plain -ag, never -agF. -F expands the format at set time, and a #() run through
# a context with no jobs is replaced by nothing and stored that way, so CPU and
# Mem rendered blank. Without -F the string stays literal and is expanded on every
# status-interval.
#
# Weather keeps catppuccin's look but calls the plugin's script directly instead
# of going through @catppuccin_status_weather. That option resolves to a literal
# "#{weather}" which tmux-weather rewrites into a #() once, while TPM loads it at
# the end of this file -- so it only worked when -F had already materialised the
# placeholder and catppuccin had set its options on an earlier load.
set -g status-right ""
set -ag status-right "#[fg=#{@thm_yellow}]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-weather/scripts/weather.sh)#[fg=#{@thm_surface_0}] "
set -ag status-right "#[bg=#{@thm_yellow},fg=#{@thm_crust}]#[reverse]█#[noreverse] CPU "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(/Users/kdvu/.config/tmux/scripts/cpu.sh)%% "
set -ag status-right "#[bg=#{@thm_peach},fg=#{@thm_crust}]#[reverse]█#[noreverse] Mem "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(/Users/kdvu/.config/tmux/scripts/mem.sh)%% "
set -ag status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse] Date "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %d/%m %H:%M "


# Allow escape sequences (e.g. OSC 7 for cwd) to pass through to the terminal
set -g allow-passthrough on

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'

# Must come AFTER tpm, or catppuccin overwrites it. Catppuccin centres the
# command prompt and drops tmux's default "fill=", so prefix+c / prefix+, drew
# the prompt on top of the window tabs instead of over a cleared line. "fill"
# paints the whole row; "align=left" puts the prompt where the cursor is.
# Same reason as message-style below: catppuccin sets mode-style at tpm time, so
# the per-appearance value has to be applied after it.
set -gF mode-style "#{@kris_mode_style}"

set -gF message-style "fg=#{@thm_crust},bg=#{@thm_yellow},fill=#{@thm_yellow},align=left"
set -gF message-command-style "fg=#{@thm_crust},bg=#{@thm_yellow},fill=#{@thm_yellow},align=left"

# Active window chip: a dark-red block with a light digit, matching WezTerm's
# active tab. Catppuccin builds both number blocks from one foreground
# (@thm_crust), and that has to stay dark ink for the tan inactive chips and for
# the status-right labels -- so the active chip alone is rebuilt here, from the
# same separator options catppuccin uses, with @kris_cur_num_* supplying the
# pair. Must come AFTER tpm, for the same reason message-style does.
#
# E: on every option, not plain #{}: some of these hold an indirection rather
# than a colour (@kris_num_* point at @thm_*, as do catppuccin's own name-block
# options), and -F expands only one level -- without E: those names survive into
# the stored format as literal text.
#
# The style is re-stated after the rounded cap, which is the point of rebuilding
# the inactive chip too. The cap ends with "#[none]", and that drops the chip's
# colours as well as its attributes -- so the digit after it was drawn in the
# status bar's default foreground, which on the tan chips was a pale grey that
# could barely be read.
#
# Hex values here are lowercase, and have to stay that way. An expanded colour
# is itself re-scanned as a format, and "#F"/"#D" uppercase are tmux's own
# window-flags and pane-id variables -- "#F2E6CF" came back as "*2E6CF" and the
# chip lost its foreground. Lowercase "#f" is not a variable, which is why
# catppuccin's own lowercase palettes never hit this.
set -gF window-status-current-format "#[fg=#{E:@kris_cur_num_fg},bg=#{E:@kris_cur_num_bg}]#{E:@catppuccin_window_current_left_separator}#[fg=#{E:@kris_cur_num_fg},bg=#{E:@kris_cur_num_bg}]#{@catppuccin_window_current_number} #[fg=#{E:@thm_fg},bg=#{E:@catppuccin_window_current_text_color}]#{@catppuccin_window_current_text}#{E:@catppuccin_window_current_right_separator}"
set -gF window-status-format         "#[fg=#{E:@kris_num_fg},bg=#{E:@kris_num_bg}]#{E:@catppuccin_window_left_separator}#[fg=#{E:@kris_num_fg},bg=#{E:@kris_num_bg}]#{@catppuccin_window_number} #[fg=#{E:@thm_fg},bg=#{E:@catppuccin_window_text_color}]#{@catppuccin_window_text}#{E:@catppuccin_window_right_separator}"

# The bar's own ground. bg is named rather than "default": default means the
# terminal's background, which in light mode is parchment and would leave the
# bar's gaps pale around dark chips. Both themes set @kris_bar_bg to the same
# value, so the bar is identical in either appearance.
#
# After tpm, like the formats above -- @thm_fg does not exist until the flavour
# has loaded, and setting this earlier stored "fg=" and drew an invalid style.
set -gF status-style "fg=#{E:@thm_fg},bg=#{E:@kris_bar_bg}"
