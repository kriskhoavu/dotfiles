# True color: tmux-256color inside, RGB passthrough outside
set -g default-terminal "tmux-256color"
# Fixed indexes, not -a: appending added another copy on every reload.
set -s terminal-overrides[10] "xterm-256color:RGB"
set -s terminal-overrides[11] '*:Ss=\E[%p1%d q:Se=\E[5 q'

# Escape delay (default 500ms lags vim)
set -sg escape-time 10

# Focus events for nvim's autoread / FocusGained
set -g focus-events on

# Ctrl-Alt-<digit> has no control code; without this it arrives as plain "1".
set -s extended-keys on
set -s terminal-features[10] "xterm*:extkeys"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

# Per-pane scroll bar (tmux owns the history, not WezTerm). Drag enters copy
# mode; q leaves. Colours in the theme files.
set -g pane-scrollbars on
set -g pane-scrollbars-position right

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r
bind r source-file ~/.tmux.conf

# prefix + T: flip light/dark for WezTerm, tmux and every nvim (each reads the
# theme once at load). -b, or the client blocks for a second.
bind T run-shell -b "~/.config/tmux/scripts/toggle-theme.sh"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen + scrollback (nested: C-a C-a L)
bind L send-keys -R \; clear-history

# Both forms, so holding Ctrl after the prefix still works.
bind -r Left previous-window
bind -r Right next-window
bind -r C-Left previous-window
bind -r C-Right next-window

# Option+1..8 jump to that window, Option+9 to the last. tmux eats these, so
# nvim's bufferline uses Alt+h / Alt+l.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t '{end}'

# New window, no prompt: auto-named after the directory basename.
bind c new-window -c '#{pane_current_path}'

# Same, but prompting. @manual_name marks a chosen label that nvim must not
# rename (nvim/lua/vim-window.lua); an empty name restores auto-naming.
bind C command-prompt -I "#{b:pane_current_path}" -p "window name:" {
  if-shell -F "#{==:%%,}" {
    new-window -c "#{pane_current_path}"
  } {
    new-window -c "#{pane_current_path}" -n "%%" ; set -w @manual_name 1
  }
}
# Rename; empty input restores automatic naming
bind , command-prompt -I "#W" -p "rename window:" {
  if-shell -F "#{==:%%,}" {
    set -uw @manual_name ; set -uw automatic-rename
  } {
    rename-window -- "%%" ; set -w @manual_name 1
  }
}

set-option -g base-index 1
set-option -g renumber-windows on

# Scratch note
bind e split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# Today's todo list
bind o split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# nvim on the right
bind v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# One window per git repo under a root. -I prefills the common case.
bind G command-prompt -I "~/Personal/01. happy-learning/Kris/fen" -p "repo root:" {
    run-shell "~/.config/tmux/scripts/tmux-org-tabs.sh '%%'"
}

# Appearance from ~/.config/kris-theme, read once per load; anything but
# "light" is dark. Themes hold only in-pane colours; the bar below is shared.
if-shell '[ "$(cat ~/.config/kris-theme 2>/dev/null)" = "light" ]' \
    'source-file ~/.config/tmux/themes/light.conf' \
    'source-file ~/.config/tmux/themes/dark.conf'

# ── Status bar ───────────────────────────────────────────────────────────────
#
# Same in both appearances, so prefix + T never touches it. Kept literal, one
# level deep: indirection forced E: into the formats.
set -g @kris_bar_bg      "#151414"  # the bar's own ground
set -g @kris_bar_fg      "#cdd6f4"  # text on the bar and on its dark blocks
set -g @kris_ink         "#11111b"  # text on a bright block -- was @thm_crust
set -g @kris_panel_bg    "#181825"  # the readouts in status-right
set -g @kris_chip_bg     "#313244"  # inactive window: the name block
set -g @kris_chip_cur_bg "#45475a"  # active window: the name block
set -g @kris_yellow      "#f9e2af"
set -g @kris_peach       "#fab387"
set -g @kris_green       "#a6e3a1"
set -g @kris_lavender    "#b4befe"

# Session and active-window chips use WezTerm's dark active tab.
set -g @kris_session_bg "#590000"
set -g @kris_session_fg "#ffffff"
set -g @kris_num_bg     "#9399b2"
set -g @kris_num_fg     "#11111b"
set -g @kris_cur_num_bg "#590000"
set -g @kris_cur_num_fg "#ffffff"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Survive a killed server. Uppercase: easier than a Ctrl combo.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# resurrect saves no user options, so @manual_name has its own hooks.
set -g @resurrect-hook-post-save-all '$HOME/.config/tmux/scripts/save-manual-names.sh'
set -g @resurrect-hook-post-restore-all '$HOME/.config/tmux/scripts/restore-manual-names.sh'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Save every 15 min, restore on server start. Continuum must load last.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Border only with 2+ panes (pane-border-status takes no format, so a hook
# flips it). Styles live in themes/*.conf: the border is drawn inside the pane.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set -g pane-border-lines double
set -g pane-border-indicators off
set -g pane-border-format "#[align=centre]#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],} #{?pane_active,#[fg=#{@kris_pane_cmd_fg}]#[bg=#{@kris_pane_cmd_bg}]#[bold] #{pane_current_command} #[default],#[fg=#{@kris_pane_inactive_fg}]#{pane_current_command}#[default]}#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],}"

# Window tabs: number block, name block, rounded caps.
# Plain `set -g`, never -gF: -F freezes #I and #W at set time.
# Caps are Nerd Font half-circles under #[reverse] (block colour on bar ground).
# #[none] resets colours too, so each block re-states its pair.
# Hex must stay lowercase: uppercase #F and #D are tmux format variables.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_cur_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-activity-style "fg=#{@kris_ink},bg=#{@kris_lavender}"
set -g window-status-bell-style "fg=#{@kris_ink},bg=#{@kris_yellow}"

# Unnamed windows show the directory basename; prefix+C / prefix+, opt out.
set -g automatic-rename-format "#{b:pane_current_path}"

set -g status-left-length 120
# Plain set, not -gF: -F would freeze #S at load. Square at the screen edge,
# tapering into the tabs with a wedge in its own red.
set -g status-left "#[bg=#{@kris_session_bg},fg=#{@kris_session_fg}] #S #[fg=#{@kris_session_bg},bg=#{@kris_bar_bg}]#[none] "

set -g status-interval 15
set -g status-right-length 120 #character length

# Plain -ag, never -agF: -F runs each #() at set time with no jobs context, so
# CPU, Mem and weather render blank.
set -g status-right ""
set -ag status-right "#[fg=#{@kris_yellow}]#[fg=#{@kris_ink},bg=#{@kris_yellow}] #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #(~/.config/tmux/scripts/weather.sh)#[fg=#{@kris_chip_bg}] "
set -ag status-right "#[bg=#{@kris_yellow},fg=#{@kris_ink}]#[reverse]█#[noreverse] CPU "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(~/.config/tmux/scripts/cpu.sh)%% "
set -ag status-right "#[bg=#{@kris_peach},fg=#{@kris_ink}]#[reverse]█#[noreverse] Mem "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(~/.config/tmux/scripts/mem.sh)%% "
set -ag status-right "#[bg=#{@kris_green},fg=#{@kris_ink}]#[reverse]█#[noreverse] Date "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] %d/%m %H:%M "

# "fill" + "align=left", or the prompt draws over the window tabs.
set -g message-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"
set -g message-command-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"

# Named, not "default" (the terminal's bg), which leaves pale gaps in light mode.
set -g status-style "fg=#{@kris_bar_fg},bg=#{@kris_bar_bg}"

# Pass escape sequences (e.g. OSC 7 cwd) to the terminal
set -g allow-passthrough on

# Must stay last
run '~/.tmux/plugins/tpm/tpm'
