# True color: tmux-256color inside tmux, passthrough RGB to the outer terminal
set -g default-terminal "tmux-256color"
# Fixed indexes, not -a: appending added another copy on every reload.
set -s terminal-overrides[10] "xterm-256color:RGB"
set -s terminal-overrides[11] '*:Ss=\E[%p1%d q:Se=\E[5 q'

# Reduce Escape key delay (default 500ms causes noticeable lag in vim)
set -sg escape-time 10

# Pass focus events through to vim/nvim (needed for autoread & FocusGained autocmds)
set -g focus-events on

# Ctrl-Alt-<digit> has no control code, so without this it arrives as plain "1".
# "on" only extends the keys that need it.
set -s extended-keys on
set -s terminal-features[10] "xterm*:extkeys"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

# Draggable scroll bar per pane (tmux owns the history, so WezTerm's cannot
# help). Dragging enters copy mode; q leaves it. Colours in the theme files.
set -g pane-scrollbars on
set -g pane-scrollbars-position right

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r
bind r source-file ~/.tmux.conf

# prefix + T: flip light/dark and tell WezTerm, tmux and every nvim -- all three
# resolve the theme once at load. -b, or the client blocks for a second.
bind T run-shell -b "~/.config/tmux/scripts/toggle-theme.sh"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen + scrollback (works in nested tmux with C-a C-a L)
bind L send-keys -R \; clear-history

# prefix + Left/Right. Both forms, so holding Ctrl after the prefix still works.
bind -r Left previous-window
bind -r Right next-window
bind -r C-Left previous-window
bind -r C-Right next-window

# Option+1..8 jump to that window, Option+9 to the last. tmux eats these before
# the pane sees them, so nvim's bufferline cycles with Alt+h / Alt+l instead.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t '{end}'

# New window, no prompt: auto-labels with the directory basename and tracks it.
bind c new-window -c '#{pane_current_path}'

# Same, but prompting (prefilled with the basename). @manual_name marks a label
# the user chose; nvim checks it before renaming (see nvim/lua/vim-window.lua).
# An empty name clears the mark and restores automatic naming.
bind C command-prompt -I "#{b:pane_current_path}" -p "window name:" {
  if-shell -F "#{==:%%,}" {
    new-window -c "#{pane_current_path}"
  } {
    new-window -c "#{pane_current_path}" -n "%%" ; set -w @manual_name 1
  }
}
# rename the current window; empty input hands it back to automatic naming
bind , command-prompt -I "#W" -p "rename window:" {
  if-shell -F "#{==:%%,}" {
    set -uw @manual_name ; set -uw automatic-rename
  } {
    rename-window -- "%%" ; set -w @manual_name 1
  }
}

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# open a note for billion $ idea
bind -r e split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r o split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# One window per git repo under a root -- a checked-out org as tabs. -I prefills
# the common case and keeps the path out of the script.
bind G command-prompt -I "~/Personal/01. happy-learning/Kris/fen" -p "repo root:" {
    run-shell "~/.config/tmux/scripts/tmux-org-tabs.sh '%%'"
}

# Appearance from ~/.config/kris-theme (this config's state, not macOS's). Read
# once per load; anything but "light" is dark, so a missing file is dark.
# The themes carry only what tmux draws inside a pane: chrome, selection, popups.
# The status bar is below and identical either way.
if-shell '[ "$(cat ~/.config/kris-theme 2>/dev/null)" = "light" ]' \
    'source-file ~/.config/tmux/themes/light.conf' \
    'source-file ~/.config/tmux/themes/dark.conf'

# ── Status bar ───────────────────────────────────────────────────────────────
#
# Chrome: the same in both appearances, so set once here and prefix + T never
# touches it. Catppuccin mocha's values, kept literal and one level deep after
# the plugin went away -- indirection is what forced E: into the formats below.
set -g @kris_bar_bg      "#151414"  # the bar's own ground
set -g @kris_bar_fg      "#cdd6f4"  # text on the bar and on its dark blocks
set -g @kris_ink         "#11111b"  # text on a bright block -- was @thm_crust
set -g @kris_panel_bg    "#181825"  # the readouts in status-right
set -g @kris_chip_bg     "#313244"  # inactive window: the name block
set -g @kris_chip_cur_bg "#45475a"  # active window: the name block
set -g @kris_yellow      "#f9e2af"
set -g @kris_peach       "#fab387"
set -g @kris_green       "#a6e3a1"
set -g @kris_lavender    "#b4befe"

# Session and active-window chips carry WezTerm's dark active tab.
set -g @kris_session_bg "#590000"
set -g @kris_session_fg "#ffffff"
set -g @kris_num_bg     "#9399b2"
set -g @kris_num_fg     "#11111b"
set -g @kris_cur_num_bg "#590000"
set -g @kris_cur_num_fg "#ffffff"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Survive a killed server. Uppercase, so it beats a Ctrl combo to reach.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# Hand-picked window names: resurrect saves no user options, so @manual_name
# needs its own pair of hooks.
set -g @resurrect-hook-post-save-all '$HOME/.config/tmux/scripts/save-manual-names.sh'
set -g @resurrect-hook-post-restore-all '$HOME/.config/tmux/scripts/restore-manual-names.sh'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Save every 15 min, restore on server start, so a reboot costs nothing.
# Continuum must be the last plugin loaded.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pane borders. On a single-pane window the border is a row spent saying "zsh",
# and pane-border-status takes no format, so a hook switches it instead.
# window-layout-changed covers both adding and losing a pane.
# The styles live in themes/*.conf: the border is drawn inside the pane, so it
# follows the appearance.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set -g pane-border-lines double
set -g pane-border-indicators off
set -g pane-border-format "#[align=centre]#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],} #{?pane_active,#[fg=#{@kris_pane_cmd_fg}]#[bg=#{@kris_pane_cmd_bg}]#[bold] #{pane_current_command} #[default],#[fg=#{@kris_pane_inactive_fg}]#{pane_current_command}#[default]}#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],}"

# Window tabs: number block, name block, rounded cap at each end.
#
# Plain `set -g`, never -gF: -F expands once, freezing #I and #W against
# whatever window was current. Stored literally, they expand on every redraw.
#
# The caps are Nerd Font half-circles under #[reverse], so the glyph comes out
# in the block's colour on the bar's ground whatever the block is coloured.
# #[none] after one resets colours too, so each block re-states its own pair.
#
# Hex must stay lowercase: uppercase #F and #D are tmux's own format variables.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_cur_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-activity-style "fg=#{@kris_ink},bg=#{@kris_lavender}"
set -g window-status-bell-style "fg=#{@kris_ink},bg=#{@kris_yellow}"

# Unnamed windows show the directory basename, not "zsh". Naming one with
# prefix+C or prefix+, turns this off for that window.
set -g automatic-rename-format "#{b:pane_current_path}"

set -g status-left-length 120
# Plain set, not -gF: -F would freeze #S at load, as with the window formats.
# The chip ends in a wedge in its own dark red, so it reads as the session
# tapering into the tabs rather than as a second accent. It opens square -- a
# cap at the screen edge is a notch cut out of the corner, not a shape.
set -g status-left "#[bg=#{@kris_session_bg},fg=#{@kris_session_fg}] #S #[fg=#{@kris_session_bg},bg=#{@kris_bar_bg}]#[none] "

set -g status-interval 15
set -g status-right-length 120 #character length

# Plain -ag, never -agF: -F runs each #() at set time with no jobs context and
# stores the empty result, so CPU, Mem and weather render blank.
set -g status-right ""
set -ag status-right "#[fg=#{@kris_yellow}]#[fg=#{@kris_ink},bg=#{@kris_yellow}] #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #(~/.config/tmux/scripts/weather.sh)#[fg=#{@kris_chip_bg}] "
set -ag status-right "#[bg=#{@kris_yellow},fg=#{@kris_ink}]#[reverse]█#[noreverse] CPU "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(~/.config/tmux/scripts/cpu.sh)%% "
set -ag status-right "#[bg=#{@kris_peach},fg=#{@kris_ink}]#[reverse]█#[noreverse] Mem "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(~/.config/tmux/scripts/mem.sh)%% "
set -ag status-right "#[bg=#{@kris_green},fg=#{@kris_ink}]#[reverse]█#[noreverse] Date "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] %d/%m %H:%M "

# Prompt line and messages. "fill" paints the whole row and "align=left" puts
# the prompt at the cursor -- without both, prefix+c draws over the window tabs.
set -g message-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"
set -g message-command-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"

# The bar's ground. Named, not "default": that means the terminal's background,
# which in light mode leaves pale gaps around the dark chips.
set -g status-style "fg=#{@kris_bar_fg},bg=#{@kris_bar_bg}"

# Allow escape sequences (e.g. OSC 7 for cwd) to pass through to the terminal
set -g allow-passthrough on

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'
