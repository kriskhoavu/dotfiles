# True color: tmux-256color inside tmux, passthrough RGB to the outer terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'

# Reduce Escape key delay (default 500ms causes noticeable lag in vim)
set -sg escape-time 10

# Pass focus events through to vim/nvim (needed for autoread & FocusGained autocmds)
set -g focus-events on

# Let Ctrl-Alt-<digit> and friends reach the program inside. Without extended
# keys a terminal can only encode the combinations that have a control code, so
# Ctrl-Alt-1 arrives as a plain "1" or as nothing at all -- which is why the org
# git float had to use a Ctrl-g prefix before. "on" only sends the extended form
# for keys that need it, so ordinary typing is unchanged.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r
bind r source-file ~/.tmux.conf

# prefix + T: flip this config between light and dark, and tell WezTerm, tmux
# and every reachable Neovim. All three resolve the theme once at load, so none
# of them notices on its own. See scripts/toggle-theme.sh.
# -b, or the tmux client blocks until the whole toggle finishes and the key
# feels dead for a second or more.
bind T run-shell -b "~/.config/tmux/scripts/toggle-theme.sh"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen + scrollback (works in nested tmux with C-a C-a L)
bind L send-keys -R \; clear-history

# switch windows with prefix + Left/Right (repeatable)
# bind both Left and C-Left so it works whether or not Ctrl is held after prefix
bind -r Left previous-window
bind -r Right next-window
bind -r C-Left previous-window
bind -r C-Right next-window

# Option+1..8 jump straight to that window, Option+9 to the last one, no prefix.
# Option is Alt here (WezTerm sends the composed key as Alt), and tmux consumes
# these before the pane sees them, which is why nvim's bufferline no longer
# binds Alt+digit -- it cycles with Alt+h / Alt+l instead.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t '{end}'

# New window, no prompt -- it auto-labels with the current directory's basename
# (see automatic-rename-format below) and keeps tracking it.
bind c new-window -c '#{pane_current_path}'

# Same, but prompting for a name (pre-filled with the directory basename --
# Enter accepts it, C-u clears the field first).
# @manual_name marks a window whose label the user chose. nvim checks it before
# syncing the window name to the current buffer (see nvim/lua/vim-window.lua),
# so a hand-picked label is not overwritten when switching files or panes.
# Submitting an empty name clears the mark and restores automatic naming.
bind C command-prompt -I "#{b:pane_current_path}" -p "window name:" {
  if-shell -F "#{==:%%,}" {
    new-window -c "#{pane_current_path}"
  } {
    new-window -c "#{pane_current_path}" -n "%%" ; set -w @manual_name 1
  }
}
# rename the current window; empty input hands it back to automatic naming
bind , command-prompt -I "#W" -p "rename window:" {
  if-shell -F "#{==:%%,}" {
    set -uw @manual_name ; set -uw automatic-rename
  } {
    rename-window -- "%%" ; set -w @manual_name 1
  }
}

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# open a note for billion $ idea
bind -r e split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r o split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# One window per git repo under a root directory -- turns a checked-out org into
# tabs, each a shell already in that repo. The prompt is prefilled with kompas, the
# common case, and is editable for any other folder of sibling repos. Enter on an
# unchanged prompt is one keypress away; -I keeps the script generic instead of
# hardcoding the path.
bind G command-prompt -I "~/Personal/01. happy-learning/Kris/kompas" -p "repo root:" {
    run-shell "~/.config/tmux/scripts/tmux-org-tabs.sh '%%'"
}

# Appearance, from ~/.config/kris-theme -- this config's own state rather than
# macOS's. Read once per config load: prefix + r re-reads it, and prefix + T
# flips it and reloads everything that has to be told. Anything but "light" is
# dark, so a missing file is dark.
#
# The themes carry only what actually differs -- the pane chrome, the copy-mode
# selection and the popups, all of which tmux draws inside a pane on top of the
# terminal's own background. Everything the status bar draws with is below,
# identical either way.
if-shell '[ "$(cat ~/.config/kris-theme 2>/dev/null)" = "light" ]' \
    'source-file ~/.config/tmux/themes/light.conf' \
    'source-file ~/.config/tmux/themes/dark.conf'

# ── Status bar ───────────────────────────────────────────────────────────────
#
# The bar is the same in both appearances: chrome, like WezTerm's tab bar,
# framing the work rather than being part of it. So its palette is set once
# here rather than twice in the themes, and prefix + T never touches it.
#
# These were catppuccin mocha's values and they stay mocha's values -- what
# went away is the plugin, not the look. The plugin only ever dressed this bar:
# tmux paints nothing inside a pane, so WezTerm and Neovim already own
# everything the eye actually reads here, and what catppuccin cost was the
# ordering. Its palette arrived at tpm time, at the end of this file, so every
# option that named a colour had to be set after tpm and had to be careful how
# many times its value was expanded on the way (@kris_num_bg pointed at
# @thm_overlay_2, which is why those formats needed E:, which is what made an
# uppercase "#F2E6CF" come back as "*2E6CF"). With the colours literal and
# one level deep, the bar is set up in one block, before the plugins, and the
# formats below expand at render time with no E: anywhere.
set -g @kris_bar_bg      "#151414"  # the bar's own ground
set -g @kris_bar_fg      "#cdd6f4"  # text on the bar and on its dark blocks
set -g @kris_ink         "#11111b"  # text on a bright block -- was @thm_crust
set -g @kris_panel_bg    "#181825"  # the readouts in status-right
set -g @kris_chip_bg     "#313244"  # inactive window: the name block
set -g @kris_chip_cur_bg "#45475a"  # active window: the name block
set -g @kris_yellow      "#f9e2af"
set -g @kris_peach       "#fab387"
set -g @kris_green       "#a6e3a1"
set -g @kris_lavender    "#b4befe"

# Session and active-window chips both carry WezTerm's dark active tab; the
# inactive window number keeps the grey it had (mocha's overlay_2).
set -g @kris_session_bg "#590000"
set -g @kris_session_fg "#ffffff"
set -g @kris_num_bg     "#9399b2"
set -g @kris_num_fg     "#11111b"
set -g @kris_cur_num_bg "#590000"
set -g @kris_cur_num_fg "#ffffff"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# save tmux session even tmux-server is killed
# use uppercase bindings so restore/save are easier to hit than Ctrl combos
# leader + S for saving from tmux-resurrect
# leader + R for restore from tmux-resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'xamut/tmux-weather'

# Pane borders - highlight active pane
#
# The border line carries the pane's command, so on a window with a single pane
# it is a label for something there is only one of -- a row of screen spent
# saying "zsh". pane-border-status takes off/top/bottom and not a format, so it
# cannot be made conditional on its own; instead it defaults to off and a hook
# turns it on for any window that has more than one pane.
#
# One hook is enough: window-layout-changed fires when a split adds a pane and
# again when one goes away, whether it was killed or its shell simply exited.
#
# The two border styles are not here but in themes/*.conf: the border is drawn
# inside the pane, on the terminal's own background, so it is one of the few
# things that does follow the appearance. Under catppuccin they were set from
# @catppuccin_pane_*_style at tpm time, which meant a toggle never updated them
# -- the active border kept whatever colour it was born with.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set -g pane-border-lines double
set -g pane-border-indicators off
set -g pane-border-format "#[align=centre]#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],} #{?pane_active,#[fg=#{@kris_pane_cmd_fg}]#[bg=#{@kris_pane_cmd_bg}]#[bold] #{pane_current_command} #[default],#[fg=#{@kris_pane_inactive_fg}]#{pane_current_command}#[default]}#{?pane_active, #[fg=#{@kris_pane_active_fg}]#[bold]⭐#[default],}"

# Window tabs: a number block, a name block, and a rounded cap at each end --
# catppuccin's "rounded" window-status style, written out.
#
# Plain `set -g`, never -gF. -F expands the whole string once, here and now:
# the colours would be fine, but #I and #W would be resolved against whatever
# window happened to be current and then frozen. Without -F the string is
# stored literally and expanded on every redraw, which is when #I, #W and
# #{@kris_*} all have to be read anyway.
#
# The caps are Nerd Font half-circles drawn with #[reverse], which swaps the
# fg and bg that are already in force: the glyph comes out in the block's
# colour on the bar's ground, so the block looks rounded whatever it is
# coloured. They are cut from @kris_bar_bg rather than the mantle catppuccin
# used, which left a faint navy halo around every chip on this darker bar.
#
# #[none] after a cap resets the colours as well as the attributes, so each
# block re-states its own pair after one -- without that the digit after the
# left cap came out in the bar's default foreground.
#
# Hex here is lowercase and has to stay that way: "#F" and "#D" uppercase are
# tmux's own window-flags and pane-id variables in a string that is expanded as
# a format.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_num_fg},bg=#{@kris_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#[fg=#{@kris_bar_bg},reverse]#[none]#[fg=#{@kris_cur_num_fg},bg=#{@kris_cur_num_bg}]#I #[fg=#{@kris_bar_fg},bg=#{@kris_chip_cur_bg}] #W#[fg=#{@kris_bar_bg},reverse]#[none]"
set -g window-status-activity-style "fg=#{@kris_ink},bg=#{@kris_lavender}"
set -g window-status-bell-style "fg=#{@kris_ink},bg=#{@kris_yellow}"

# Windows that were never named explicitly fall back to the current directory's
# basename rather than "zsh". Naming one with prefix+C (or prefix+,) turns this
# automatic renaming off for that window, so the chosen label sticks.
set -g automatic-rename-format "#{b:pane_current_path}"

set -g status-left-length 120
# Plain set, not -gF, for the same reason as the window formats above: -F would
# consume the #S and freeze whatever the session was called at load.
#
# The session name ends in a wedge pointing into the window tabs: the two used
# to run together, a dark-red block against the first tab's grey one, with
# nothing to say where the session stopped and the windows began. The wedge
# carries the chip's own dark red, so it reads as the chip tapering off rather
# than as a third colour on a bar that has one accent.
#
# It opens square, though. The rounded cap that used to be here sat against the
# very left edge of the screen, so half of it was a notch cut out of the corner
# of the bar rather than a shape with ground around it. The window chips keep
# their caps: those float in the middle of the bar, which is what the shape is
# for.
set -g status-left "#[bg=#{@kris_session_bg},fg=#{@kris_session_fg}] #S #[fg=#{@kris_session_bg},bg=#{@kris_bar_bg}]#[none] "

set -g status-interval 15
set -g status-right-length 120 #character length

# Plain -ag, never -agF. -F expands the format at set time, and a #() run through
# a context with no jobs is replaced by nothing and stored that way, so CPU and
# Mem rendered blank. Without -F the string stays literal and is expanded on every
# status-interval.
#
# Weather calls the plugin's script directly rather than going through
# @catppuccin_status_weather, which resolved to a literal "#{weather}" that
# tmux-weather rewrote into a #() once -- so it only worked when -F had already
# materialised the placeholder on an earlier load.
set -g status-right ""
set -g status-right ""
set -ag status-right "#[fg=#{@kris_yellow}]#[fg=#{@kris_ink},bg=#{@kris_yellow}] #[fg=#{@kris_bar_fg},bg=#{@kris_chip_bg}] #(~/.tmux/plugins/tmux-weather/scripts/weather.sh)#[fg=#{@kris_chip_bg}] "
set -ag status-right "#[bg=#{@kris_yellow},fg=#{@kris_ink}]#[reverse]█#[noreverse] CPU "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(/Users/kdvu/.config/tmux/scripts/cpu.sh)%% "
set -ag status-right "#[bg=#{@kris_peach},fg=#{@kris_ink}]#[reverse]█#[noreverse] Mem "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] #(/Users/kdvu/.config/tmux/scripts/mem.sh)%% "
set -ag status-right "#[bg=#{@kris_green},fg=#{@kris_ink}]#[reverse]█#[noreverse] Date "
set -ag status-right "#[fg=#{@kris_bar_fg},bg=#{@kris_panel_bg}] %d/%m %H:%M "

# The prompt line and the messages. Catppuccin used to own mode-style and set
# these at tpm time, which is why they had to be re-applied after it; now
# mode-style lives in themes/*.conf (it is drawn inside the pane) and these are
# just set. "fill" paints the whole row and "align=left" puts the prompt where
# the cursor is -- catppuccin centred it and dropped the fill, which drew
# prefix+c / prefix+, on top of the window tabs.
set -g message-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"
set -g message-command-style "fg=#{@kris_ink},bg=#{@kris_yellow},fill=#{@kris_yellow},align=left"

# The bar's own ground. bg is named rather than "default": default means the
# terminal's background, which in light mode is a warm off-white and would leave
# gaps pale around dark chips.
set -g status-style "fg=#{@kris_bar_fg},bg=#{@kris_bar_bg}"

# Allow escape sequences (e.g. OSC 7 for cwd) to pass through to the terminal
set -g allow-passthrough on

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'
