# True color: tmux-256color inside tmux, passthrough RGB to the outer terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'

# Reduce Escape key delay (default 500ms causes noticeable lag in vim)
set -sg escape-time 10

# Pass focus events through to vim/nvim (needed for autoread & FocusGained autocmds)
set -g focus-events on

# Let Ctrl-Alt-<digit> and friends reach the program inside. Without extended
# keys a terminal can only encode the combinations that have a control code, so
# Ctrl-Alt-1 arrives as a plain "1" or as nothing at all -- which is why the org
# git float had to use a Ctrl-g prefix before. "on" only sends the extended form
# for keys that need it, so ordinary typing is unchanged.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r 
bind r source-file ~/.tmux.conf

# Window navigation on prefix + h / l, matching the vim motions used everywhere
# else. Repeatable, so prefix then l l l walks three windows along.
bind -r h previous-window
bind -r l next-window

# Resizing takes the arrows the windows just gave up. Not Ctrl-hjkl: TPM loads
# after this file and vim-tmux-navigator binds prefix C-l for itself, so a
# resize there would be silently overwritten. Not the uppercase letters either:
# L already clears the scrollback.
#
# j and k are unbound explicitly so that reloading a running server drops the
# resize they used to do, instead of leaving it behind.
unbind j
unbind k
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen + scrollback (works in nested tmux with C-a C-a L)
bind L send-keys -R \; clear-history

# Window switching used to live on the arrows; prefix + h / l has it now, and
# the arrows resize. C-Left / C-Right are unbound so a reload does not leave the
# old behaviour on half the keys.
unbind C-Left
unbind C-Right

# Option+1..8 jump straight to that window, Option+9 to the last one, no prefix.
# Option is Alt here (WezTerm sends the composed key as Alt), and tmux consumes
# these before the pane sees them, which is why nvim's bufferline no longer
# binds Alt+digit -- it cycles with Alt+h / Alt+l instead.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t '{end}'

# New window, no prompt -- it auto-labels with the current directory's basename
# (see automatic-rename-format below) and keeps tracking it.
bind c new-window -c '#{pane_current_path}'

# Same, but prompting for a name (pre-filled with the directory basename --
# Enter accepts it, C-u clears the field first).
# @manual_name marks a window whose label the user chose. nvim checks it before
# syncing the window name to the current buffer (see nvim/lua/vim-window.lua),
# so a hand-picked label is not overwritten when switching files or panes.
# Submitting an empty name clears the mark and restores automatic naming.
bind C command-prompt -I "#{b:pane_current_path}" -p "window name:" {
  if-shell -F "#{==:%%,}" {
    new-window -c "#{pane_current_path}"
  } {
    new-window -c "#{pane_current_path}" -n "%%" ; set -w @manual_name 1
  }
}
# rename the current window; empty input hands it back to automatic naming
bind , command-prompt -I "#W" -p "rename window:" {
  if-shell -F "#{==:%%,}" {
    set -uw @manual_name ; set -uw automatic-rename
  } {
    rename-window -- "%%" ; set -w @manual_name 1
  }
}

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# open a note for billion $ idea
bind -r e split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r o split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# One window per git repo under a root directory -- turns a checked-out org into
# tabs, each a shell already in that repo. The prompt is prefilled with kompas, the
# common case, and is editable for any other folder of sibling repos. Enter on an
# unchanged prompt is one keypress away; -I keeps the script generic instead of
# hardcoding the path.
bind G command-prompt -I "~/Personal/01. happy-learning/Kris/kompas" -p "repo root:" {
    run-shell "~/.config/tmux/scripts/tmux-org-tabs.sh '%%'"
}

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# save tmux session even tmux-server is killed
# use uppercase bindings so restore/save are easier to hit than Ctrl combos
# leader + S for saving from tmux-resurrect
# leader + R for restore from tmux-resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'xamut/tmux-weather'

# Pane borders - highlight active pane
set -g pane-border-status top
set -g pane-border-lines double
set -g pane-border-indicators off
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#ffffff,bold"
set -g pane-border-format "#[align=centre]#{?pane_active, #[fg=#ffffff]#[bold]⭐#[default],} #{?pane_active,#[fg=#ffffff]#[bg=#8b0000]#[bold] #{pane_current_command} #[default],#[fg=#{@thm_surface_1}]#{pane_current_command}#[default]}#{?pane_active, #[fg=#ffffff]#[bold]⭐#[default],}"

# status bar 
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Label tabs with the window name (#W) instead of catppuccin's default #T,
# which is the pane title and is always just the hostname here.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Windows that were never named explicitly fall back to the current directory's
# basename rather than "zsh". Naming one with prefix+C (or prefix+,) turns this
# automatic renaming off for that window, so the chosen label sticks.
set -g automatic-rename-format "#{b:pane_current_path}"

set -g window-status-separator ""  # Removes the space between windows

set -g status-left-length 120
#set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]#[noreverse]#S #[fg=#{@thm_green},bg=#{@thm_sapphire}]#[fg=#{@thm_crust},bg=#{@thm_sapphire}] #{s|$HOME|~|:pane_current_path} "
set -g status-left "#[bg=#{@thm_sapphire},fg=#{@thm_crust}]#[reverse]#[noreverse]#S "

set -g status-style fg=default,bg=default
set -g status-interval 15
set -g status-right-length 120 #character length

# Plain -ag, never -agF. -F expands the format at set time, and a #() run through
# a context with no jobs is replaced by nothing and stored that way, so CPU and
# Mem rendered blank. Without -F the string stays literal and is expanded on every
# status-interval.
#
# Weather keeps catppuccin's look but calls the plugin's script directly instead
# of going through @catppuccin_status_weather. That option resolves to a literal
# "#{weather}" which tmux-weather rewrites into a #() once, while TPM loads it at
# the end of this file -- so it only worked when -F had already materialised the
# placeholder and catppuccin had set its options on an earlier load.
set -g status-right ""
set -ag status-right "#[fg=#{@thm_yellow}]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-weather/scripts/weather.sh)#[fg=#{@thm_surface_0}] "
set -ag status-right "#[bg=#{@thm_yellow},fg=#{@thm_crust}]#[reverse]█#[noreverse] CPU "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(/Users/kdvu/.config/tmux/scripts/cpu.sh)%% "
set -ag status-right "#[bg=#{@thm_peach},fg=#{@thm_crust}]#[reverse]█#[noreverse] Mem "
set -ag status-right "#[fg=#cdd6f4,bg=#181825] #(/Users/kdvu/.config/tmux/scripts/mem.sh)%% "
set -ag status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse] Date "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %d/%m %H:%M "


# Allow escape sequences (e.g. OSC 7 for cwd) to pass through to the terminal
set -g allow-passthrough on

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'

# Must come AFTER tpm, or catppuccin overwrites it. Catppuccin centres the
# command prompt and drops tmux's default "fill=", so prefix+c / prefix+, drew
# the prompt on top of the window tabs instead of over a cleared line. "fill"
# paints the whole row; "align=left" puts the prompt where the cursor is.
set -gF message-style "fg=#{@thm_crust},bg=#{@thm_yellow},fill=#{@thm_yellow},align=left"
set -gF message-command-style "fg=#{@thm_crust},bg=#{@thm_yellow},fill=#{@thm_yellow},align=left"
