# vim:set ft=tmux:
#
# What the light appearance changes: everything tmux draws inside a pane, over
# the terminal's own background -- border chrome, copy-mode selection, popups.
# The status bar is the same in both and lives in .tmux.conf.
#
# These sit on the Claude light palette's warmed ground (#eedfd1, see
# wezterm/lua/palette.lua), so dark.conf's white-on-near-black would be
# invisible here.

set -g @kris_pane_active_fg   "#141413"
set -g @kris_pane_cmd_bg      "#8c1b1b"
set -g @kris_pane_cmd_fg      "#faf9f5"
# Dim on purpose, but mocha's surface grey against this ground is under 1.5:1
# and simply vanishes, so light takes a warm grey at 5:1 -- still much quieter
# than the dark-red chip.
set -g @kris_pane_inactive_fg "#565653"

# The border lines. Here, not in .tmux.conf, so a toggle actually moves them:
# expanded once at tpm time, the active border kept its start-up colour.
set -g pane-border-style "fg=#c3b8a7"
set -gF pane-active-border-style "fg=#{@kris_pane_active_fg},bold"

# Copy-mode selection: WezTerm's light selection colour, carrying the ink. The
# dark theme's navy landed on this ground as a black box with whatever
# foreground the text underneath happened to have.
set -g mode-style "fg=#141413,bg=#d3a184,bold"

# Popups sit over a pane, so they take the pane's side too: a step down the
# ramp from the editor's ground, so a popup reads as lifted.
set -g popup-style "bg=#e2d6c6,fg=#141413"
set -g popup-border-style "fg=#c3b8a7"
