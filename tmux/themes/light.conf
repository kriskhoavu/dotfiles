# vim:set ft=tmux:
#
# Light appearance: what tmux draws inside a pane (borders, copy-mode
# selection, popups) on WezTerm's warmed ground #e4d6c9. The bar is in .tmux.conf.

set -g @kris_pane_active_fg   "#111110"
set -g @kris_pane_cmd_bg      "#8c1b1b"
set -g @kris_pane_cmd_fg      "#faf9f5"
# Mocha's surface grey is under 1.5:1 here; a warm grey at 5:1, still quieter
# than the chip.
set -g @kris_pane_inactive_fg "#353533"

# Here, not in .tmux.conf, so a toggle moves them (expanded at tpm time they
# kept their start-up colour).
set -g pane-border-style "fg=#bbb0a1"
set -gF pane-active-border-style "fg=#{@kris_pane_active_fg},bold"

# Dark-red slider on the tab bar's ground.
set -g pane-scrollbars-style "fg=#8c1b1b,bg=#d9cdbe,width=1,pad=0"

# WezTerm's light selection colour with explicit ink; dark's navy became a
# black box here.
set -g mode-style "fg=#111110,bg=#d3a184,bold"

# Lighter than the pane ground behind a black border, so the popup reads as lifted.
set -g popup-style "bg=#eee7df,fg=#111110"
set -g popup-border-style "fg=#111110"
