# vim:set ft=tmux:
#
# What the light appearance changes -- which is only the pane chrome. The status
# bar is deliberately dark in both appearances (see .tmux.conf): it is chrome,
# the way WezTerm's tab bar is, and reads better staying put.
#
# These four are drawn on the terminal's own parchment background, not on the
# bar, so dark.conf's white-on-near-black would be invisible here.

set -g @kris_pane_active_fg   "#241a17"
set -g @kris_pane_cmd_bg      "#8c1b1b"
set -g @kris_pane_cmd_fg      "#e9d0ab"
# Dim on purpose, but mocha's @thm_surface_1 against the parchment is 1.5:1 and
# simply vanishes, so light takes a dark warm grey: still quieter than the
# active chip, still readable.
set -g @kris_pane_inactive_fg "#53462e"

# Copy-mode selection. Drawn inside the pane, over the terminal body, so unlike
# the status bar it has to follow the appearance -- catppuccin's own mode-style
# is mocha surface_0, a dark navy that landed on the parchment as a black box
# with whatever foreground the text underneath happened to have. This is
# WezTerm's light selection colour, carrying the ink.
set -g @kris_mode_style "fg=#241a17,bg=#b3935f,bold"
