# vim:set ft=tmux:
#
# What the dark appearance changes. The status bar is not here: it is the same
# in both appearances and lives in .tmux.conf, so all that differs is the pane
# chrome, which is drawn on the terminal's own background.

# Pane chrome. The active border and the command chip on it are picked for
# contrast against the pane background: white on near-black, with the dark-red
# chip from the tab bar.
set -g @kris_pane_active_fg   "#ffffff"
set -g @kris_pane_cmd_bg      "#8b0000"
set -g @kris_pane_cmd_fg      "#ffffff"
set -g @kris_pane_inactive_fg "#{@thm_surface_1}"

# Copy-mode selection, with an explicit foreground: catppuccin sets only a
# background, leaving the selected text whatever colour it already was.
set -g @kris_mode_style "fg=#cdd6f4,bg=#313244,bold"
