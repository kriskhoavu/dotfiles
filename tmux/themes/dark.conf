# vim:set ft=tmux:
#
# Dark appearance: what tmux draws inside a pane (borders, copy-mode
# selection, popups). The bar is in .tmux.conf.

# White on near-black, with the tab bar's dark-red chip.
set -g @kris_pane_active_fg   "#ffffff"
set -g @kris_pane_cmd_bg      "#8b0000"
set -g @kris_pane_cmd_fg      "#ffffff"
set -g @kris_pane_inactive_fg "#45475a"

# Here, not in .tmux.conf, so a toggle moves them (expanded at tpm time they
# kept their start-up colour).
set -g pane-border-style "fg=#45475a"
set -gF pane-active-border-style "fg=#{@kris_pane_active_fg},bold"

# Dark-red slider on the tab bar's ground.
set -g pane-scrollbars-style "fg=#8b0000,bg=#1a1919,width=1,pad=0"

# Copy-mode selection, with an explicit foreground.
set -g mode-style "fg=#cdd6f4,bg=#313244,bold"

set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a"
