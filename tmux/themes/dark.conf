# vim:set ft=tmux:
#
# What the dark appearance changes: everything tmux draws inside a pane, over
# the terminal's own background -- border chrome, copy-mode selection, popups.
# The status bar is the same in both and lives in .tmux.conf.

# Pane chrome. The active border and the command chip on it are picked for
# contrast against the pane background: white on near-black, with the dark-red
# chip from the tab bar.
set -g @kris_pane_active_fg   "#ffffff"
set -g @kris_pane_cmd_bg      "#8b0000"
set -g @kris_pane_cmd_fg      "#ffffff"
set -g @kris_pane_inactive_fg "#45475a"

# The border lines. Here, not in .tmux.conf, so a toggle actually moves them:
# expanded once at tpm time, the active border kept its start-up colour.
set -g pane-border-style "fg=#45475a"
set -gF pane-active-border-style "fg=#{@kris_pane_active_fg},bold"

# Copy-mode selection, with an explicit foreground: set as a style rather than
# through an option the toggle re-applies, which is what the catppuccin era
# needed because the plugin claimed mode-style at tpm time.
set -g mode-style "fg=#cdd6f4,bg=#313244,bold"

# Popups sit over a pane, so they take the pane's side too.
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a"
